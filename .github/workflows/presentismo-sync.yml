name: Presentismo Sync

on:
  schedule:
    # Cada 1 hora, todo el día — "desde" en el portal siempre es el día
    # anterior a "hasta" (hoy), así que cada corrida vuelve a traer el
    # rango completo; el upsert (rut_persona, local_code, entrada) hace
    # que las marcaciones repetidas de corridas anteriores no dupliquen.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha 'hasta' (YYYY-MM-DD, opcional). 'desde' es siempre el día anterior. Vacío = hoy."
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Instala el navegador (Camoufox) que usa StealthyFetcher — mismo
      # rol que `playwright install` en los otros bots de este repo.
      - run: scrapling install

      - name: Sync
        env:
          FRAX_USER: ${{ secrets.FRAX_USER }}
          FRAX_PASS: ${{ secrets.FRAX_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FECHA: ${{ github.event.inputs.fecha }}
        run: python src/sync.py
