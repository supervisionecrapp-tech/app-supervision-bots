name: Presentismo Sync

on:
  # Cron DESACTIVADO el 2026-08-19: Frax migró el portal de Presentismo de
  # Power BI (bi.frax.cl, lo que este workflow todavía scrapea) a un portal
  # propio "APE2" (controltienda.com) protegido con Cloudflare Turnstile,
  # que no se puede resolver por automatización (confirmado en pruebas
  # reales — ver rama fix/presentismo-nuevo-portal). Mientras no haya una
  # vía sin captcha (ej. que Frax exima la cuenta), la carga es semi-manual
  # desde admin-panel.html. Se deja solo workflow_dispatch por si se
  # retoma la automatización.
  # schedule:
  #   # 07:00 America/Santiago = 11:00 UTC — corrida especial: carga el día
  #   # ANTERIOR completo (ver el paso "Calcular fecha" más abajo).
  #   - cron: "0 11 * * *"
  #   # Cada 2 horas de 9:00 a 23:00 America/Santiago (sin horario de
  #   # verano en Chile continental — ver la misma nota en red-sync.yml):
  #   # 9,11,13,15,17,19,21,23 Chile = 13,15,17,19,21,23,1,3 UTC. Las
  #   # últimas dos cruzan la medianoche UTC (siguen siendo el mismo día
  #   # calendario en Chile) — cron las trata igual, no hace falta nada
  #   # especial. Estas corridas cargan el día ACTUAL (FECHA vacío).
  #   - cron: "0 13,15,17,19,21,23,1,3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      # La corrida de las 07:00 Chile (11:00 UTC) es la única que carga
      # el día ANTERIOR — el resto carga el día actual. A las 07:00 Chile
      # el día calendario en UTC y en Chile todavía coincide (Chile va
      # 4h atrás, sin cruzar medianoche), así que "ayer en UTC" acá
      # siempre es lo mismo que "ayer en Chile".
      - name: Calcular fecha especial (07:00 = día anterior)
        id: fecha
        run: |
          if [ "$(date -u +%H)" = "11" ]; then
            echo "fecha=$(date -u -d '-1 day' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          else
            echo "fecha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Presentismo
        env:
          FECHA: ${{ github.event.inputs.fecha || steps.fecha.outputs.fecha }}
          FRAX_USER: ${{ secrets.FRAX_USER }}
          FRAX_PASS: ${{ secrets.FRAX_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      - name: Subir capturas de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-presentismo
          path: |
            presentismo-sync/downloads/debug-*.png
          if-no-files-found: ignore
