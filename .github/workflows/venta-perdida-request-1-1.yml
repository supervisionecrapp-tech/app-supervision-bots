name: Venta Perdida Sync — Request 1.1

on:
  # `schedule` nativo desactivado (29/08/2026): el disparo real lo hace un
  # pg_cron en Supabase (job "dispatch-venta-perdida-request") pegándole a
  # la API de workflow_dispatch, porque `schedule` está bloqueado/atrasado
  # a nivel de cuenta en GitHub — horario 08:00 Chile, lun/mié/vie. El
  # objetivo de semana lo sigue decidiendo src/scrape.mjs#targetWeekForToday
  # según el día.
  workflow_dispatch:

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: venta-perdida-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Solo pide la descarga en el portal y sale — no espera a que
      # termine (la cola es lenta e intermitente, hasta ~45 min).
      # venta-perdida-collect.yml la busca y la baja más tarde.
      - name: Solicitar descarga de Venta Perdida
        env:
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run request
