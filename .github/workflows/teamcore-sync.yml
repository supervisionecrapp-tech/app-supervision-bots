name: Teamcore Sync

on:
  schedule:
    # Cada 2 horas de 9:00 a 23:00 America/Santiago (sin horario de
    # verano en Chile continental — ver la misma nota en red-sync.yml):
    # 9,11,13,15,17,19,21,23 Chile = 13,15,17,19,21,23,1,3 UTC.
    - cron: "0 13,15,17,19,21,23,1,3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
