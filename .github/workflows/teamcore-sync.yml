name: Teamcore Sync

on:
  schedule:
    # Cada 2 horas, 11:00 a 19:00 Chile: 11,13,15,17,19 Chile = 15,17,19,21,23 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano.)
    #
    # Cada 2 horas, 11:00 a 19:00 Chile: 11,13,15,17,19 Chile = 15,17,19,21,23 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano.)
    #
    # `schedule` no dispara en esta cuenta (supervisionecrapp-tech, recién
    # creada): probado cada 1 min dos veces (28/08 y 28/08 ~20:15 UTC tras
    # el commit 406369a de "re-registro"), 10+ min cada vez, CERO triggers.
    # No es un tema de este workflow ni de frecuencia — es un bloqueo de
    # `schedule` a nivel de cuenta (probablemente medida anti-abuso de
    # GitHub en cuentas nuevas). Pendiente: ticket a GitHub Support. Hasta
    # que se resuelva, estos bots solo corren por workflow_dispatch manual.
    - cron: "0 15,17,19,21,23 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
