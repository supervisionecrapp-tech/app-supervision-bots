name: Teamcore Sync

on:
  schedule:
    # TEMPORAL — cada 3 minutos, a pedido explícito del usuario, SOLO para
    # probar rápido si el schedule nativo volvió a andar (la cuenta
    # supervisionecrapp-tech es nueva y GitHub bloquea los triggers
    # `schedule` en cuentas nuevas hasta verificar email/spending limit).
    # Revertir a la línea de abajo apenas se confirme un run con
    # event=schedule.
    - cron: "*/3 * * * *"
    # - cron: "0 15,17,19,21,23 * * *"  # real: cada 2 horas, 11-19 Chile — restaurar esto
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
