name: Teamcore Sync

on:
  schedule:
    # Cada 2 horas, 11:00 a 19:00 Chile: 11,13,15,17,19 Chile = 15,17,19,21,23 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano.)
    #
    # Se probó temporalmente a cada 3 minutos el 28/08/2026 para diagnosticar
    # por qué los `schedule` de todo el repo no disparaban (cuenta
    # supervisionecrapp-tech recién creada — GitHub bloquea `schedule` en
    # cuentas nuevas hasta verificar algo, todavía sin identificar qué
    # exactamente). 8 minutos a cada 3 min sin un solo trigger confirmó el
    # bloqueo; no era un problema de este workflow en particular.
    # reprocesado 2026-08-28 20:00 UTC — forzar re-registro del schedule tras bloqueo de cuenta nueva
    - cron: "0 15,17,19,21,23 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
