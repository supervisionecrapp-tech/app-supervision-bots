name: DEC Documentos Sync

on:
  schedule:
    # Cada 3 horas (a pedido explícito) — el offset UTC-3 de Chile
    # (continental, sin horario de verano) no rompe el patrón de 3 en 3,
    # así que no hace falta convertir a hora Chile. Corre a las xx:00 UTC
    # = xx-3:00 Chile, ej. 11:00 UTC = 08:00 Chile, 14:00 UTC = 11:00
    # Chile, etc. Antes de las 13:00 Chile (16:00 UTC) ya corrió al menos
    # una vez desde medianoche, para que notificaciones-documentos.yml
    # (13:00 Chile) lea datos frescos del día.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dec-documentos-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ trae WebSocket nativo — @supabase/supabase-js lo necesita
          # para inicializar el cliente (aunque no usemos Realtime) y en
          # Node 20 tira error al hacer createClient().
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Sync DEC Documentos
        env:
          DEC_IDD_USER: ${{ secrets.DEC_IDD_USER }}
          DEC_IDD_PASS: ${{ secrets.DEC_IDD_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      # Se sube siempre (success() || failure()) — las capturas de
      # depuración son justamente para diagnosticar cuando algo falla, en
      # especial el login por Identidad Digital (Acepta), la parte menos
      # verificada del flujo (ver comentarios en src/scrape.mjs).
      - name: Subir capturas de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            dec-documentos-sync/downloads/debug-*.png
          if-no-files-found: ignore
