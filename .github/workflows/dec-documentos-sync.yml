name: DEC Documentos Sync

on:
  schedule:
    # Cada 1 hora, 6:00 a 23:00 Chile — mismo patrón y mismo horario que
    # presentismo-sync.yml/smu-presentismo-sync.yml (a pedido explícito:
    # "deja la corrida al igual que presentismo cada 1 hora"). Chile
    # continental es UTC-4 fijo (sin horario de verano, mismo criterio que
    # el resto de los bots): 6-23 Chile = 10-23,0-3 UTC.
    - cron: "0 10-23,0-3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dec-documentos-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ trae WebSocket nativo — @supabase/supabase-js lo necesita
          # para inicializar el cliente (aunque no usemos Realtime) y en
          # Node 20 tira error al hacer createClient().
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Sync DEC Documentos
        env:
          DEC_IDD_USER: ${{ secrets.DEC_IDD_USER }}
          DEC_IDD_PASS: ${{ secrets.DEC_IDD_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      # Se sube siempre (success() || failure()) — las capturas de
      # depuración son justamente para diagnosticar cuando algo falla, en
      # especial el login por Identidad Digital (Acepta), la parte menos
      # verificada del flujo (ver comentarios en src/scrape.mjs).
      - name: Subir capturas de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            dec-documentos-sync/downloads/debug-*.png
          if-no-files-found: ignore
