name: DEC Documentos Sync

on:
  schedule:
    # Cada 5 horas, 7:00 a 22:00 Chile: 7,12,17,22 Chile = 11,16,21,2 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano — mismo
    # criterio que el resto de los bots). Bajado de 1 hora a 5 horas
    # (18 -> 4 corridas diarias): era el bot mas caro del repo
    # (~1.370 min/mes de los 2.000 disponibles) y los documentos
    # pendientes de firma no cambian con cadencia horaria.
    - cron: "0 11,16,21,2 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dec-documentos-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ trae WebSocket nativo — @supabase/supabase-js lo necesita
          # para inicializar el cliente (aunque no usemos Realtime) y en
          # Node 20 tira error al hacer createClient().
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Sync DEC Documentos
        env:
          DEC_IDD_USER: ${{ secrets.DEC_IDD_USER }}
          DEC_IDD_PASS: ${{ secrets.DEC_IDD_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      # Se sube siempre (success() || failure()) — las capturas de
      # depuración son justamente para diagnosticar cuando algo falla, en
      # especial el login por Identidad Digital (Acepta), la parte menos
      # verificada del flujo (ver comentarios en src/scrape.mjs).
      - name: Subir capturas de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            dec-documentos-sync/downloads/debug-*.png
          if-no-files-found: ignore
