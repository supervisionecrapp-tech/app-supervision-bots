name: Notificaciones Documentos Pendientes

on:
  schedule:
    # Lunes/Miércoles/Viernes 12:00 America/Santiago = 16:00 UTC.
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notificaciones-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Documentos pendientes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: npm run start -- documentos-pendientes
