name: Asistencia Sync

on:
  schedule:
    # Sync cada 3 horas, 08:00 a 17:00 Chile: 8,11,14,17 Chile = 12,15,18,21 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano.)
    - cron: "0 12,15,18,21 * * *"
    # Reset diario, 3:00 AM Chile = 07:00 UTC.
    - cron: "0 7 * * *"
    # El roster de colaboradores (Turnos Extras) ya NO se programa aca: se
    # movio a pg_cron en Supabase, invocando la Edge Function roster-sync
    # (misma logica, misma hora 06:00 Chile) — ver
    # supabase/migrations/20260828030000_cron_roster_y_cobertura.sql.
    # El workflow_dispatch con modo=roster sigue disponible como respaldo
    # manual, y el paso "Roster de colaboradores" de abajo lo atiende.
  workflow_dispatch:
    inputs:
      modo:
        description: "sync, reset o roster"
        required: false
        default: "sync"
        type: choice
        options: [sync, reset, roster]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: asistencia-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Un solo workflow con dos horarios: github.event.schedule identifica
      # cuál de los dos cron disparó esta corrida. workflow_dispatch usa el
      # input "modo" en su lugar.
      - name: Elegir modo (sync/reset)
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ github.event.inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "modo=reset" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "modo=roster" >> "$GITHUB_OUTPUT"
          else
            echo "modo=sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync
        if: steps.modo.outputs.modo == 'sync'
        env:
          GEOVICTORIA_KEY: ${{ secrets.GEOVICTORIA_KEY }}
          GEOVICTORIA_SECRET: ${{ secrets.GEOVICTORIA_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      - name: Reset
        if: steps.modo.outputs.modo == 'reset'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run reset

      - name: Roster de colaboradores (Turnos Extras)
        if: steps.modo.outputs.modo == 'roster'
        env:
          GEOVICTORIA_KEY: ${{ secrets.GEOVICTORIA_KEY }}
          GEOVICTORIA_SECRET: ${{ secrets.GEOVICTORIA_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run roster
