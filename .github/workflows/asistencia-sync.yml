name: Asistencia Sync

on:
  schedule:
    # Sync cada 3 horas, 7:00 a 22:00 America/Santiago (Chile continental
    # es UTC-4 fijo, sin horario de verano — mismo criterio que
    # red-sync.yml/teamcore-sync.yml): 7,10,13,16,19,22 Chile =
    # 11,14,17,20,23,2 UTC. Bajado de 1 hora a 3 horas (17 -> 6 corridas
    # diarias) para caber en los 2.000 min/mes de Actions; la API de
    # GeoVictoria devuelve el rango completo en cada corrida, asi que
    # espaciar no pierde marcaciones, solo las muestra mas tarde.
    - cron: "0 11,14,17,20,23,2 * * *"
    # Reset diario, 3:00 AM Chile = 07:00 UTC.
    - cron: "0 7 * * *"
    # Roster de colaboradores (Turnos Extras) diario, 6:00 AM Chile = 10:00 UTC
    # — antes de que arranque el día, para que los supervisores ya vean el
    # roster actualizado desde la primera solicitud.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "sync, reset o roster"
        required: false
        default: "sync"
        type: choice
        options: [sync, reset, roster]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: asistencia-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Un solo workflow con dos horarios: github.event.schedule identifica
      # cuál de los dos cron disparó esta corrida. workflow_dispatch usa el
      # input "modo" en su lugar.
      - name: Elegir modo (sync/reset)
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ github.event.inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "modo=reset" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "modo=roster" >> "$GITHUB_OUTPUT"
          else
            echo "modo=sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync
        if: steps.modo.outputs.modo == 'sync'
        env:
          GEOVICTORIA_KEY: ${{ secrets.GEOVICTORIA_KEY }}
          GEOVICTORIA_SECRET: ${{ secrets.GEOVICTORIA_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      - name: Reset
        if: steps.modo.outputs.modo == 'reset'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run reset

      - name: Roster de colaboradores (Turnos Extras)
        if: steps.modo.outputs.modo == 'roster'
        env:
          GEOVICTORIA_KEY: ${{ secrets.GEOVICTORIA_KEY }}
          GEOVICTORIA_SECRET: ${{ secrets.GEOVICTORIA_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run roster
