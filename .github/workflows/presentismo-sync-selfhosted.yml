name: Presentismo Sync (login real, self-hosted)

# No depende de ninguna cookie: loguea de cero resolviendo el Turnstile en
# cada corrida (ver src/sync_login.py). Por eso SOLO puede correr en un
# runner self-hosted con IP residencial — Turnstile nunca entrega el token
# desde los runners de GitHub (rangos de Azure), confirmado en
# bots/MIGRACION.md §5. Registrar el runner: Settings > Actions > Runners >
# New self-hosted runner, en una máquina con IP normal (no datacenter) y
# con display real o xvfb (el scrape corre headful a propósito, Cloudflare
# detecta Chrome headless).
#
# Mientras no haya un runner self-hosted registrado con label "self-hosted",
# este workflow se queda en cola sin correr — no consume minutos de
# ubuntu-latest ni rompe nada por sí solo.

on:
  schedule:
    # Mismo horario que presentismo-sync-1-1.yml (10:00 a 16:00 Chile).
    # Corriendo los dos en paralelo mientras se confirma que este reemplaza
    # al de cookie: bot_runs distingue "presentismo-sync" de
    # "presentismo-sync-login", y el upsert en presentismo_registros
    # deduplica si ambos traen el mismo rango.
    - cron: "5 14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha 'hasta' (YYYY-MM-DD, opcional). 'desde' es siempre el día anterior. Vacío = hoy."
        required: false
        type: string

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: scrapling install

      - name: Instalar xvfb y xdotool
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xdotool

      - name: Sync (login real)
        env:
          FRAX_USER: ${{ secrets.FRAX_USER }}
          FRAX_PASS: ${{ secrets.FRAX_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FECHA: ${{ github.event.inputs.fecha }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python src/sync_login.py
          else
            python src/sync_login.py
          fi

      - name: Subir pantallazos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentismo-sync-login-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: presentismo-sync/downloads/screenshots/
          if-no-files-found: ignore
          retention-days: 14
