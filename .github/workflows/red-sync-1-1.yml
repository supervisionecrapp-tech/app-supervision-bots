name: Red Sync 1.1

on:
  schedule:
    # Lunes/miércoles/viernes (mismos días que venta-perdida-*.yml, a
    # pedido explícito del usuario) + martes (para no perder la recarga de
    # la semana anterior — ver el paso "Sync Red — semana anterior" más
    # abajo, que sigue detectando martes por su cuenta). 11:00
    # America/Santiago = 15:00 UTC (Chile continental tiene hora única
    # todo el año, sin horario de verano — si eso cambia, ajustar este
    # offset).
    # reprocesado 2026-08-28 20:00 UTC — forzar re-registro del schedule tras bloqueo de cuenta nueva
    - cron: "0 15 * * 1,2,3,5"
  workflow_dispatch:
    inputs:
      categoria:
        description: "VSR | ABI | NARTD"
        required: true
        default: "NARTD"
      anio:
        description: "Año (vacío = usar semana actual)"
        required: false
      mes:
        description: "Mes (vacío = usar mes actual)"
        required: false
      semana:
        description: "Semana (vacío = usar semana actual)"
        required: false

jobs:
  # Las corridas programadas (cron) sincronizan las 3 categorías; una
  # corrida manual (workflow_dispatch) solo hace la que se elija en el
  # input. Este job arma la lista según de dónde vino el disparo, y el
  # job de abajo la usa como matrix para correr una por categoría en
  # paralelo.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      categorias: ${{ steps.set.outputs.categorias }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'categorias=["NARTD","ABI","VSR"]' >> "$GITHUB_OUTPUT"
          else
            echo 'categorias=["${{ github.event.inputs.categoria || 'NARTD' }}"]' >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        categoria: ${{ fromJson(needs.setup.outputs.categorias) }}
    defaults:
      run:
        working-directory: red-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ trae WebSocket nativo — @supabase/supabase-js lo necesita
          # para inicializar el cliente (aunque no usemos Realtime) y en
          # Node 20 tira error al hacer createClient().
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      # El cron corre a las 14:00 UTC = 10:00 Chile del MISMO día
      # calendario (no cruza medianoche), así que el día de la semana en
      # el runner (UTC) coincide con el día real en Chile — no hace falta
      # convertir zona horaria para esta comparación.
      - name: Detectar día de la semana
        id: day
        run: echo "dow=$(date +%u)" >> "$GITHUB_OUTPUT" # 1=lunes … 7=domingo

      - name: "Sync Red — semana actual"
        env:
          CATEGORIA: ${{ matrix.categoria }}
          ANIO: ${{ github.event.inputs.anio }}
          MES: ${{ github.event.inputs.mes }}
          SEMANA: ${{ github.event.inputs.semana }}
          DOWNLOAD_DIR: ./downloads-actual
          DATAWALT_USER: ${{ secrets.DATAWALT_USER }}
          DATAWALT_PASS: ${{ secrets.DATAWALT_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      # Solo los martes programados (no en corridas manuales) también se
      # recarga la semana anterior completa, para las 3 categorías —
      # reemplaza lo que ya estaba cargado (el upsert de uploadRedFile ya
      # hace ese reemplazo por sala_id+año+semana, no hace falta borrar
      # nada antes).
      - name: "Sync Red — semana anterior (solo martes)"
        if: github.event_name == 'schedule' && steps.day.outputs.dow == '2'
        env:
          CATEGORIA: ${{ matrix.categoria }}
          WEEKS_BACK: "1"
          DOWNLOAD_DIR: ./downloads-anterior
          DATAWALT_USER: ${{ secrets.DATAWALT_USER }}
          DATAWALT_PASS: ${{ secrets.DATAWALT_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync

      # Se suben siempre (success() || failure()) porque las capturas de
      # depuración son justamente para diagnosticar cuando algo falla.
      # Un nombre por categoría porque con matrix corren 3 jobs en
      # paralelo y un artifact compartido pisaría los de los otros.
      - name: Subir capturas de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ matrix.categoria }}
          path: |
            red-sync/downloads-actual/debug-*.png
            red-sync/downloads-actual/debug-*.html
            red-sync/downloads-anterior/debug-*.png
            red-sync/downloads-anterior/debug-*.html
          if-no-files-found: ignore
