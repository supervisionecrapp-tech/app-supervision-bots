name: Presentismo Sync 1.1

on:
  schedule:
    # A partir del 29/08/2026, mismo horario que smu-presentismo-sync.yml
    # a propósito (a pedido explícito del usuario) — 4 veces al día, 10:00
    # a 16:00 Chile = 14,16,18,20 UTC (Chile continental es UTC-4 fijo, sin
    # horario de verano).
    #
    # El 28/08 corrió cada 1 hora (18/día) para probar la cookie de sesión
    # + el keepalive de Supabase (presentismo-keepalive, cada 10 min) recién
    # armados — con eso confirmado, no hace falta esa frecuencia: con la
    # cookie cada corrida exitosa tarda ~1-2 min (sin login, sin esperar al
    # solver de Turnstile), muy por debajo de los ~1.820 min/mes que
    # consumían las 18 corridas/día de la época con login normal.
    # reprocesado 2026-08-28 20:00 UTC — forzar re-registro del schedule tras bloqueo de cuenta nueva
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha 'hasta' (YYYY-MM-DD, opcional). Vacío = hoy."
        required: false
        type: string
      desde:
        description: "Fecha 'desde' (YYYY-MM-DD, opcional). Vacío = el día anterior a 'hasta' (comportamiento normal). Para backfills de varios días."
        required: false
        type: string
      motor:
        description: "Motor del login: camoufox (Firefox endurecido) o scrapling (Chromium)."
        required: false
        default: camoufox
        type: choice
        options: [camoufox, scrapling]

jobs:
  run:
    # ubuntu-latest alcanza desde el 14/09/2026: el bot ya no necesita que
    # Turnstile emita token (que desde los rangos de Azure no pasaba nunca)
    # ni una cookie de sesión capturada a mano. El propio login.php activa
    # `cf_fallback=1` si el widget no resuelve en 7s y el servidor acepta el
    # login así — verificado bloqueando challenges.cloudflare.com.
    # La variable PRESENTISMO_RUNNER se respeta por si algún día conviene un
    # runner propio, pero ya no hace falta.
    runs-on: ${{ vars.PRESENTISMO_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Instala el navegador que usa StealthyFetcher — mismo rol que
      # `playwright install` en los otros bots de este repo.
      - run: scrapling install

      # Baja el build de Firefox de Camoufox (el paquete de pip, que ya
      # instaló requirements.txt, no lo incluye).
      - run: python -m camoufox fetch

      # El scrape corre HEADFUL (headless=False) porque Cloudflare detecta
      # Chrome headless. En Linux eso necesita un display: xvfb se lo da
      # virtual. En un runner propio de Windows/macOS ya hay uno real.
      # xdotool: para clickear el checkbox de Turnstile con un click real
      # del servidor X en vez de uno por CDP, que Turnstile ignora.
      - name: Instalar xvfb y xdotool
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xdotool

      - name: Sync
        env:
          FRAX_USER: ${{ secrets.FRAX_USER }}
          FRAX_PASS: ${{ secrets.FRAX_PASS }}
          # Solo para escribir en Supabase (bot_runs + presentismo_registros).
          # Ya no se lee ninguna cookie de bot_config: sync_login.py loguea
          # de cero en cada corrida.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Opcional y hoy SIN USAR: el bot entra bien desde la IP del
          # runner con MOTOR=camoufox. Queda por si alguna vez hace falta
          # salir por otra IP; si el secret no existe, se sale directo.
          FRAX_PROXY: ${{ secrets.FRAX_PROXY }}
          # Motor del login: "camoufox" (Firefox endurecido, sin CDP) o
          # "scrapling" para el StealthySession de Chromium.
          # camoufox es el que funciona: con Chromium el Turnstile escala a
          # checkbox interactivo y el server contesta error=captcha.
          MOTOR: ${{ github.event.inputs.motor || 'camoufox' }}
          FECHA: ${{ github.event.inputs.fecha }}
          DESDE: ${{ github.event.inputs.desde }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python -u src/sync_login.py
          else
            python -u src/sync_login.py
          fi

      # Pantallazos de cada paso del flujo (login, index, reportes, export),
      # más uno extra si el flujo tira excepción — para diagnosticar en qué
      # paso exacto falló sin poder mirar la pantalla en vivo. Se suben
      # siempre (no solo en error) porque hay reintentos internos y el
      # último intento exitoso también puede traer pantallazos útiles de
      # intentos previos fallidos.
      - name: Subir pantallazos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentismo-sync-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: presentismo-sync/downloads/screenshots/
          if-no-files-found: ignore
          retention-days: 14
