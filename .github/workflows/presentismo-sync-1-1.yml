name: Presentismo Sync 1.1

on:
  schedule:
    # A partir del 29/08/2026, mismo horario que smu-presentismo-sync.yml
    # a propósito (a pedido explícito del usuario) — 4 veces al día, 10:00
    # a 16:00 Chile = 14,16,18,20 UTC (Chile continental es UTC-4 fijo, sin
    # horario de verano).
    #
    # El 28/08 corrió cada 1 hora (18/día) para probar la cookie de sesión
    # + el keepalive de Supabase (presentismo-keepalive, cada 10 min) recién
    # armados — con eso confirmado, no hace falta esa frecuencia: con la
    # cookie cada corrida exitosa tarda ~1-2 min (sin login, sin esperar al
    # solver de Turnstile), muy por debajo de los ~1.820 min/mes que
    # consumían las 18 corridas/día de la época con login normal.
    # reprocesado 2026-08-28 20:00 UTC — forzar re-registro del schedule tras bloqueo de cuenta nueva
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha 'hasta' (YYYY-MM-DD, opcional). 'desde' es siempre el día anterior. Vacío = hoy."
        required: false
        type: string

jobs:
  run:
    # Se elige por variable de repo (Settings > Variables > PRESENTISMO_RUNNER)
    # para poder mover el bot a un runner propio SIN tocar el código.
    #
    # Por qué importa: medido el 27/08, en el Chrome real del usuario y desde
    # su IP, Turnstile emite el token solo, invisible, en menos de 8s
    # (`tokenLen: 773`). Desde los runners de GitHub (rangos de Azure) no lo
    # emite nunca — ni headless, ni headful con Chrome real y locale es-CL.
    # La diferencia es la reputación de la IP, no el código.
    runs-on: ${{ vars.PRESENTISMO_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Instala el navegador que usa StealthyFetcher — mismo rol que
      # `playwright install` en los otros bots de este repo.
      - run: scrapling install

      # El scrape corre HEADFUL (headless=False) porque Cloudflare detecta
      # Chrome headless. En Linux eso necesita un display: xvfb se lo da
      # virtual. En un runner propio de Windows/macOS ya hay uno real.
      # xdotool: para clickear el checkbox de Turnstile con un click real
      # del servidor X en vez de uno por CDP, que Turnstile ignora.
      - name: Instalar xvfb y xdotool
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xdotool

      - name: Sync
        env:
          FRAX_USER: ${{ secrets.FRAX_USER }}
          FRAX_PASS: ${{ secrets.FRAX_PASS }}
          # La cookie de sesión (si hay una viva) se lee de bot_config en
          # Supabase con este mismo service role key — no de un secret de
          # GitHub aparte. Un solo lugar, que también actualiza/lee
          # presentismo-keepalive. Se genera con
          # presentismo-sync/scripts/capturar_cookie.py.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FECHA: ${{ github.event.inputs.fecha }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # -screen explícito: xvfb-run por defecto levanta 1280x1024,
            # mientras el browser arranca --start-maximized creyendo tener
            # 1920x1080. Con esa diferencia las coordenadas que calcula
            # scrape.py para el click de xdotool caen fuera de la pantalla
            # (run 33131225717: el checkbox quedó intacto tras el click).
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python src/sync.py
          else
            python src/sync.py
          fi

      # Pantallazos de cada paso del flujo (login, index, reportes, export),
      # más uno extra si el flujo tira excepción — para diagnosticar en qué
      # paso exacto falló sin poder mirar la pantalla en vivo. Se suben
      # siempre (no solo en error) porque hay reintentos internos y el
      # último intento exitoso también puede traer pantallazos útiles de
      # intentos previos fallidos.
      - name: Subir pantallazos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentismo-sync-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: presentismo-sync/downloads/screenshots/
          if-no-files-found: ignore
          retention-days: 14
