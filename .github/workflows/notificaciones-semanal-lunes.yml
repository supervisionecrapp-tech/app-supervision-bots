name: Notificaciones Semanal (Lunes)

on:
  schedule:
    # ~10:00 America/Santiago = ~14:00 UTC (sin horario de verano en Chile
    # continental — ver la misma nota en teamcore-sync.yml). Minuto corrido a
    # :04 (no exacto) porque los cron en minutos redondos (:00/:10/:15/:30)
    # son los que más se caen bajo congestión de GitHub Actions — recomendado
    # por la propia doc de GitHub.
    - cron: "4 14 * * 1"
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: notificaciones-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Presentismo semanal
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: npm run start -- presentismo-semanal

      - name: Teamcore semanal
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: npm run start -- teamcore-semanal
