name: Venta Perdida Sync — Retry 1.1

on:
  # `schedule` nativo desactivado (29/08/2026): el disparo real lo hace un
  # pg_cron en Supabase (job "dispatch-venta-perdida-retry") pegándole a
  # la API de workflow_dispatch, porque `schedule` está bloqueado/atrasado
  # a nivel de cuenta en GitHub — horario 15:00 Chile, lun/mié/vie (3h
  # después de "collect").
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: venta-perdida-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Reintentar Venta Perdida si algo quedó pendiente hoy
        env:
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run retry
