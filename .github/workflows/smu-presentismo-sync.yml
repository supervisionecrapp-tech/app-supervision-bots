name: SMU Presentismo Sync

on:
  schedule:
    # Cada 3 horas, 6:00 a 21:00 America/Santiago (Chile continental sin
    # horario de verano): 6,9,12,15,18,21 Chile = 10,13,16,19,22,1 UTC.
    # Bajado de 1 hora a 3 horas (18 -> 6 corridas diarias) por el
    # presupuesto de minutos de Actions. El upsert por (rut, local_code,
    # fecha, acceso, ocurrencia) hace que las filas repetidas de corridas
    # anteriores no dupliquen, asi que espaciar no pierde accesos.
    - cron: "0 10,13,16,19,22,1 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: smu-presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Portal "GeoVictoria Externos" de SMU: app clásica con login
      # usuario/contraseña por formulario, sin Playwright (todo con fetch,
      # ver src/scrape.mjs).
      - name: Sync SMU Presentismo (Accesos)
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          SMU_GV_USER: ${{ secrets.SMU_GV_USER }}
          SMU_GV_PASS: ${{ secrets.SMU_GV_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
