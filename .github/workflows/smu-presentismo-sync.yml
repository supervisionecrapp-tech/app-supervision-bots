name: SMU Presentismo Sync

on:
  schedule:
    # Cada 2 horas, 10:00 a 16:00 Chile: 10,12,14,16 Chile = 14,16,18,20 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano.)
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: smu-presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Portal "GeoVictoria Externos" de SMU: app clásica con login
      # usuario/contraseña por formulario, sin Playwright (todo con fetch,
      # ver src/scrape.mjs).
      - name: Sync SMU Presentismo (Accesos)
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          SMU_GV_USER: ${{ secrets.SMU_GV_USER }}
          SMU_GV_PASS: ${{ secrets.SMU_GV_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
