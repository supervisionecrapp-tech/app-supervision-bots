name: SMU Presentismo Sync

on:
  schedule:
    # Mismo horario que presentismo-sync.yml (Presentismo WM): cada 1 hora,
    # 6:00 a 23:00 America/Santiago (Chile continental sin horario de
    # verano): 6-23 Chile = 10-23,0-3 UTC. El upsert por (rut, local_code,
    # fecha, acceso, ocurrencia) hace que las filas repetidas de corridas
    # anteriores no dupliquen.
    - cron: "0 10-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smu-presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Portal "GeoVictoria Externos" de SMU: app clásica con login
      # usuario/contraseña por formulario, sin Playwright (todo con fetch,
      # ver src/scrape.mjs).
      - name: Sync SMU Presentismo (Accesos)
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          SMU_GV_USER: ${{ secrets.SMU_GV_USER }}
          SMU_GV_PASS: ${{ secrets.SMU_GV_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
