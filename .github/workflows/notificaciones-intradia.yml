name: Notificaciones Intradía (Presentismo + Teamcore)

on:
  schedule:
    # ~9:13, 11:13, 13:13, 15:13, 17:13 America/Santiago = 13:13, 15:13,
    # 17:13, 19:13, 21:13 UTC — ~13 min después de cada corrida de
    # presentismo-sync/teamcore-sync que cae en la ventana 8:00-18:00.
    # Minuto :13 (no redondo, no :10) — ver nota de por qué en
    # notificaciones-semanal-lunes.yml.
    - cron: "13 13,15,17,19,21 * * *"
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notificaciones-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Avance del día
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: npm run start -- intradia-combinado
