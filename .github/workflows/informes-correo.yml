name: Informes por correo

# Lo dispara Supabase: informes_programados() cada hora para los envíos que
# tocan, e informes_enviar_ahora() desde el botón del portal. A mano sirve
# para pruebas: sin envio_id manda el informe de la zona a los destinatarios
# que se indiquen.
on:
  workflow_dispatch:
    inputs:
      envio_id:
        description: "Envío configurado en el portal (vacío = prueba suelta)"
        default: ""
      manual:
        description: "si = disparado a mano (manda aunque esté desactivado)"
        default: "si"
      solo_a:
        description: "Con envio_id: prueba, manda solo a estos correos (coma) y no queda en el log"
        default: ""
      zona:
        description: "Prueba suelta: zona (talca, viña, arica, iquique o todas)"
        default: "todas"
      para:
        description: "Prueba suelta: destinatarios (separados por coma)"
        default: "supervisionecrapp@gmail.com"

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: informes-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Navegador desde el CDN de Playwright; libs del sistema aparte y con
      # tope (el mirror apt de Azure a veces se arrastra 10+ min y colgaba el job).
      - run: npx playwright install chromium
        timeout-minutes: 3
      - name: Libs del sistema (apt, con tope)
        run: timeout 120 npx playwright install-deps chromium || echo "apt no respondio a tiempo, sigo con las libs del runner"
        timeout-minutes: 3

      - name: Enviar
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIO_ID: ${{ inputs.envio_id }}
          MANUAL: ${{ inputs.manual }}
          ZONA: ${{ inputs.zona }}
          PARA: ${{ inputs.para }}
          SOLO_A: ${{ inputs.solo_a }}
        run: |
          if [ -n "$ENVIO_ID" ]; then
            npm run start -- envio "$ENVIO_ID" "$MANUAL"
          else
            npm run start -- salas_foco "$ZONA" "$PARA"
          fi
