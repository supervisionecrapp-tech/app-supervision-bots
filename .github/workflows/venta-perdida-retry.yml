name: Venta Perdida Sync — Retry

on:
  schedule:
    # Lunes/miércoles/viernes 15:00 Chile = 19:00 UTC — 3h después de
    # "collect" (5h después de "request"). Si para esa hora el collect de
    # hoy ya quedó success no hace nada; si no, reintenta desde donde
    # haya quedado (ver runRetry() en src/sync.mjs): si la solicitud ya
    # se había hecho, solo reintenta la descarga/carga; si ni eso, repite
    # el flujo completo para la semana que le tocaba a hoy.
    - cron: "0 19 * * 1,3,5"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: venta-perdida-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Reintentar Venta Perdida si algo quedó pendiente hoy
        env:
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run retry
