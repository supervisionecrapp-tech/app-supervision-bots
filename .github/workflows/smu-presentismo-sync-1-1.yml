name: SMU Presentismo Sync 1.1

on:
  # `schedule` nativo desactivado (29/08/2026): el disparo real lo hace un
  # pg_cron en Supabase (job "dispatch-smu-presentismo-sync") pegándole a
  # la API de workflow_dispatch, porque `schedule` está bloqueado/atrasado
  # a nivel de cuenta en GitHub — horario 10,12,14,16 Chile, diario.
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: smu-presentismo-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Portal "GeoVictoria Externos" de SMU: app clásica con login
      # usuario/contraseña por formulario, sin Playwright (todo con fetch,
      # ver src/scrape.mjs).
      - name: Sync SMU Presentismo (Accesos)
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          SMU_GV_USER: ${{ secrets.SMU_GV_USER }}
          SMU_GV_PASS: ${{ secrets.SMU_GV_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
