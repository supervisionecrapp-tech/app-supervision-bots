name: Teamcore Sync 1.1

on:
  # `schedule` nativo desactivado (29/08/2026): venía bloqueado a nivel de
  # cuenta (probado con 2FA y con este mismo workflow recreado desde cero,
  # ver historial de commits) y cuando arrancó a disparar lo hizo con
  # atraso (~1h) y solapado con el dispatch de pg_cron, duplicando
  # corridas. El disparo real ahora lo hace un pg_cron en Supabase (job
  # "dispatch-teamcore-sync") pegándole a la API de workflow_dispatch —
  # horario 11,13,15,17,19 Chile, diario.
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
