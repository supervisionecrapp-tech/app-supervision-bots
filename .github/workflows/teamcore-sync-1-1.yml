name: Teamcore Sync 1.1

on:
  # Sin `schedule`: el reloj de GitHub descartaba corridas (desde el 27/09).
  # Lo dispara pg_cron de Supabase por workflow_dispatch, ver
  # supabase/migrations/20260929150000_cron_dispatch_bots_github.sql
  # (Teamcore: 11,13,15,17,19 Chile; horarios en UTC en esa migracion).
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD, día final del rango (vacío = hoy). Siempre baja también el día anterior."
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
