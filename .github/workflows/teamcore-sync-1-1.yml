name: Teamcore Sync 1.1

on:
  schedule:
    # Workflow "1.1": archivo nuevo (no un rename) para que GitHub lo trate
    # como una automatización recién creada, después de activar 2FA en la
    # cuenta supervisionecrapp-tech — a ver si así deja de bloquear
    # `schedule`. El "Teamcore Sync" viejo (sin 1.1) queda eliminado.
    #
    # Cada 1 min desde ~16:30 Chile (20:30 UTC) del 28/08/2026 en adelante,
    # para confirmar cuanto antes si dispara solo. Volver al horario normal
    # (11,13,15,17,19 Chile = 15,17,19,21,23 UTC) apenas se confirme.
    - cron: "* * * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
