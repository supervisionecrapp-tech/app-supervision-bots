name: Teamcore Sync 1.1

on:
  schedule:
    # Cada 2 horas, 11:00 a 19:00 Chile: 11,13,15,17,19 Chile = 15,17,19,21,23 UTC
    # (Chile continental es UTC-4 fijo, sin horario de verano.)
    #
    # Workflow "1.1": archivo nuevo (no un rename), creado 28/08/2026 tras
    # activar 2FA en la cuenta supervisionecrapp-tech, para descartar que
    # `schedule` estuviera bloqueado por "registro viejo" del workflow.
    # Probado cada 1 min con ID de workflow nuevo (344911120) + 2FA activo:
    # 5+ min, CERO triggers — mismo resultado que las pruebas anteriores
    # (cuenta vieja, sin 2FA, workflow original). Descarta ambas hipótesis;
    # el bloqueo de `schedule` no depende del workflow ni del 2FA. Sigue
    # pendiente: ticket a GitHub Support. Hasta que se resuelva, estos bots
    # solo corren por workflow_dispatch manual.
    - cron: "0 15,17,19,21,23 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "YYYY-MM-DD (vacío = hoy)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: teamcore-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # A diferencia de red-sync/presentismo-sync, este bot no usa
      # Playwright — el portal de Teamcore es una app Django normal
      # (login usuario/contraseña + CSRF estándar), todo se hace con
      # fetch. No hace falta instalar navegadores.
      - name: Sync Teamcore Usabilidad
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
