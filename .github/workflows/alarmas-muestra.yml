name: Alarmas B2B - muestra

# Baja los PDF de las últimas alarmas B2B reenviadas a la cuenta de informes
# y los deja como artifact, para revisar su formato. Solo lectura.
on:
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cuántos correos revisar"
        default: "12"

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: informes-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Bajar PDF
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANTIDAD: ${{ inputs.cantidad }}
        run: node src/alarmas_muestra.mjs alarmas "$CANTIDAD"
      - uses: actions/upload-artifact@v4
        with:
          name: alarmas-pdf
          path: informes-sync/alarmas
          retention-days: 3
