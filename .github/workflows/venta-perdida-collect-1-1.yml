name: Venta Perdida Sync — Collect 1.1

on:
  # `schedule` nativo desactivado (29/08/2026): el disparo real lo hace un
  # pg_cron en Supabase (job "dispatch-venta-perdida-collect") pegándole a
  # la API de workflow_dispatch, porque `schedule` está bloqueado/atrasado
  # a nivel de cuenta en GitHub — horario 10:00 Chile, lun/mié/vie (2h
  # después de "request").
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: venta-perdida-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Busca el job que "request" pidió más temprano (por nombre
      # determinístico, sin estado compartido), espera a que quede
      # SUCCEEDED, baja el CSV y lo sube a Supabase.
      - name: Buscar, descargar y cargar Venta Perdida
        env:
          TEAMCORE_USER: ${{ secrets.TEAMCORE_USER }}
          TEAMCORE_PASS: ${{ secrets.TEAMCORE_PASS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect
